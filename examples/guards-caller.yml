# Caller for the guards in a repository that wants them as a TRUSTED gate. It runs the reusable
# workflow and its scripts from the `main` branch of the tooling repository, never from the pull
# request under test, so a pull request cannot edit the gate that grades it. Pin both refs to the
# same reviewed commit SHA instead of `main` if you prefer immutability. See docs/guards.md.
name: Guards

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run on the head it replaces. Pushes to main are never
# cancelled, so every commit on main keeps a complete record. The group includes the workflow name,
# so this workflow never cancels a different workflow's run on the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guards:
    uses: datacrew-space/ci-workflows/.github/workflows/guards.yml@main
    with:
      tooling-ref: main
    secrets:
      PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
