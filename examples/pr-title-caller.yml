# Optional: check that pull-request titles follow Conventional Commits, so squash-merge subjects share
# one style. Copy to .github/workflows/pr-title.yml. It is not part of ci-ok by default; add its job
# to your gate's `needs` (and RESULTS) if titles must be enforced. Pin the ref to a reviewed commit.
name: PR title

on:
  pull_request:
    # `edited` reruns the check when the title is fixed, without a new push.
    types: [opened, edited, synchronize, reopened]

# A new push or edit to a pull request cancels the run it replaces; see tests/test_pr_concurrency.py.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  title:
    uses: datacrew-space/ci-workflows/.github/workflows/pr-title.yml@<commit-sha>
    with:
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
      # types: feat fix docs chore   # narrow or widen the allowed types
