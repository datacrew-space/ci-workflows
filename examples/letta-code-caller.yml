name: Letta Code

# Copy to .github/workflows/letta-code.yml and pin the `uses:` ref to a commit SHA of
# datacrew-space/ci-workflows. It stays off until the repository variable LETTA_CODE_ENABLED is `true`.
#
# The caller owns the triggers. These four are every event that can summon the agent; see the header of
# the reusable workflow for which ones do. Do not add `pull_request_target`: the job has write access
# and a secret.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  letta:
    if: ${{ vars.LETTA_CODE_ENABLED == 'true' }}
    uses: datacrew-space/ci-workflows/.github/workflows/letta-code.yml@<COMMIT_SHA>
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      agent-id: ${{ vars.LETTA_AGENT_ID }}
      # trigger-phrase: "@letta-code"
      # label-trigger: letta-code
      # runs-on: '"ubuntu-latest"'
    secrets:
      LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
