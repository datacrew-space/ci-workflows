# Config used by the reusable guards workflow (.github/workflows/guards.yml): secret scanners only.
# The private-terms and commit-identity checks run as separate steps over the right commit range.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
