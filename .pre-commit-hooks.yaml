# Hooks other repositories can use from their own .pre-commit-config.yaml. See docs/guards.md.
- id: private-terms
  name: private-terms (staged changes)
  entry: scripts/check-private-terms.sh --staged
  language: script
  minimum_pre_commit_version: 3.2.0
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
- id: private-terms-message
  name: private-terms (commit message)
  entry: scripts/check-private-terms.sh --message
  language: script
  minimum_pre_commit_version: 3.2.0
  stages: [commit-msg]
- id: commit-identity
  name: commit-identity
  entry: scripts/check-commit-identity.sh --identity
  language: script
  minimum_pre_commit_version: 3.2.0
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
# Docs hooks. They run Python through scripts/run-python.sh, which uses the caller's environment
# (docs-python-imports imports the caller's own package). See docs/docs-hooks.md.
- id: docs-internal-refs
  name: docs-internal-refs (public docs)
  entry: scripts/run-python.sh scripts/check_docs_internal_refs.py
  language: script
  minimum_pre_commit_version: 3.2.0
  types_or: [markdown, text]
  stages: [pre-commit]
- id: docs-private-links
  name: docs-private-links (public docs)
  entry: scripts/run-python.sh scripts/check_docs_private_links.py
  language: script
  minimum_pre_commit_version: 3.2.0
  types_or: [markdown, text]
  stages: [pre-commit]
- id: docs-python-imports
  name: docs-python-imports (doc samples)
  entry: scripts/run-python.sh scripts/check_docs_python_imports.py
  language: script
  minimum_pre_commit_version: 3.2.0
  types: [markdown]
  stages: [pre-commit]
- id: gitattributes-lf
  name: gitattributes-lf
  entry: scripts/run-python.sh scripts/check_gitattributes.py
  language: script
  minimum_pre_commit_version: 3.2.0
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
