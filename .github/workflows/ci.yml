name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Classifier fixtures
        run: bash tests/test-classify-claude-review.sh

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  guards:
    uses: ./.github/workflows/guards.yml
    with:
      tooling-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
