name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Classifier fixtures
        run: bash tests/test-classify-claude-review.sh

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # The TRUSTED gate: the workflow and the scripts both come from `main`, never from the pull request
  # being checked, so a PR cannot edit them to pass without a denylist (it cannot read the secret
  # either on a fork). Changes to the guard scripts themselves are exercised by the `test` job.
  # `allowed-email-regex` adds the repository owner's own address to the default noreply allowlist:
  # a squash merge made from the web UI is attributed to that address.
  guards:
    uses: datacrew-space/ci-workflows/.github/workflows/guards.yml@main
    with:
      tooling-ref: main
      allowed-email-regex: '(@users\.noreply\.github\.com|^noreply@github\.com|^noreply@anthropic\.com|^jaewilson07@gmail\.com)$'
    secrets:
      PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
