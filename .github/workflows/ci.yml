name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Classifier fixtures
        run: bash tests/test-classify-claude-review.sh

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # BOOTSTRAP ONLY. This calls the pull request's own copy of the workflow with the pull request's own
  # scripts, so a pull request can edit them and make this job pass without a denylist. It is not a
  # trustworthy gate, and must not be a required check, until a follow-up PR changes it to
  #   uses: datacrew-space/ci-workflows/.github/workflows/guards.yml@main
  #   with: { tooling-ref: main }
  # (see examples/guards-caller.yml). That form cannot be used before this file exists on main.
  guards:
    uses: ./.github/workflows/guards.yml
    with:
      tooling-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
