name: Pull request title (reusable)

# Optional check that a pull request's title follows Conventional Commits, so squash-merge subjects
# share one style: `type(optional scope)!: subject`. Call it from a thin workflow on `pull_request`
# with the `edited` type, so fixing the title clears the failure without a push; see
# examples/pr-title-caller.yml. It reads nothing from the repository and needs no permissions.
# The title is untrusted: it reaches the shell only through `env`, and is never printed.

on:
  workflow_call:
    inputs:
      types:
        description: Allowed commit types, separated by spaces or newlines.
        type: string
        default: "build chore ci docs feat fix perf refactor revert style test"
      runs-on:
        description: >-
          Runner as a JSON string: a label or an array of labels, e.g. '"ubuntu-latest"' or
          '["self-hosted","linux"]'.
        type: string
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  title:
    name: title
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          TYPES: ${{ inputs.types }}
        run: |
          set -euo pipefail
          rule='Title must be "type(optional scope)!: subject", e.g. "fix(lint): keep quoted args together".'
          if [ -z "${TITLE:-}" ]; then
            echo "::error::No pull request title. Call this workflow from a pull_request trigger." >&2
            exit 1
          fi
          read -r -d '' -a allowed <<<"$TYPES" || true
          if [ "${#allowed[@]}" -eq 0 ]; then
            echo "::error::The types input lists no types." >&2
            exit 1
          fi
          re='^([a-z]+)(\([^()]+\))?(!)?: ([^[:space:]].*)$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::${rule}" >&2
            exit 1
          fi
          type="${BASH_REMATCH[1]}"
          for t in "${allowed[@]}"; do
            if [ "$t" = "$type" ]; then
              echo "Title follows Conventional Commits (type: ${type})."
              exit 0
            fi
          done
          echo "::error::Type '${type}' is not allowed. Use one of: ${allowed[*]}. ${rule}" >&2
          exit 1
