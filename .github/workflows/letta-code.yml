name: Letta Code (reusable)

# A reusable workflow. It lets a maintainer summon a Letta agent:
#   - by writing the trigger phrase (default `@letta-code`) in an issue comment, a pull request comment
#     or a pull request review comment;
#   - by opening an issue whose title or body contains the phrase;
#   - by adding the trigger label (default `letta-code`) to an ISSUE.
# Nothing else summons it. A pull request body, a label on a pull request and a push never do: the
# action at the pinned commit has no trigger for them.
#
# Off by default, twice over:
#   - the caller's job runs only when the repository variable LETTA_CODE_ENABLED is `true`
#     (examples/letta-code-caller.yml);
#   - with no LETTA_API_KEY or no `agent-id`, the job reports and never calls the agent.
#
# One step decides whether an event may summon the agent ("Decide whether the agent may act"), and the
# action starts only when it says yes. That matters because the action checks the actor's write access
# BEFORE it looks for a trigger and FAILS the job for anyone without it, so letting it see every comment
# on a public repository would paint a red run per outside comment. The decision is tested by running it
# (tests/test_letta_code_workflow.py). The action still makes the final check: a `COLLABORATOR` with
# less than write access, or a triage-role user adding the label, passes the decision and fails there.
#
# The caller owns the triggers. A job that starts on every comment costs a runner for a few seconds
# each time, even when no phrase is present.
#
# Security: the agent job holds contents, issues and pull-requests write on the caller's repository,
# and the Letta API key. It runs on `pull_request`, never `pull_request_target`, so a fork's pull
# request gets no secret and the agent steps are skipped. No secret and no event text is written into a
# shell script: the decision step gets associations and true/false answers through the environment.
# Once summoned, the agent reads issue, pull request and comment text that anyone may have written.
# The action is pinned by commit SHA, but it installs the latest Letta Code CLI from npm at run time, so
# the pin does not fix everything that runs; the runner needs npm.
#
# Secret: LETTA_API_KEY (a plain GitHub secret).

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: '"ubuntu-latest"'
      agent-id:
        description: Id of the Letta agent to run. Empty means the job reports and skips the agent.
        type: string
        default: ""
      trigger-phrase:
        type: string
        default: "@letta-code"
      label-trigger:
        description: Label that summons the agent when added to an issue (not a pull request)
        type: string
        default: letta-code
    secrets:
      LETTA_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  letta:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Decide whether the agent may act
        id: act
        env:
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          AGENT_ID: ${{ inputs.agent-id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_ASSOCIATION: ${{ github.event.issue.author_association }}
          COMMENT_HAS_PHRASE: ${{ contains(github.event.comment.body, inputs.trigger-phrase) }}
          ISSUE_HAS_PHRASE: ${{ contains(github.event.issue.title, inputs.trigger-phrase) || contains(github.event.issue.body, inputs.trigger-phrase) }}
          LABEL_MATCHES: ${{ github.event.label.name == inputs.label-trigger }}
        run: |
          trusted() {
            case "$1" in
              OWNER|MEMBER|COLLABORATOR) return 0 ;;
            esac
            return 1
          }

          act=false
          why="$EVENT_NAME/$EVENT_ACTION never summons the agent"
          case "$EVENT_NAME/$EVENT_ACTION" in
            issue_comment/created|pull_request_review_comment/created)
              if ! trusted "$COMMENT_ASSOCIATION"; then
                why="the comment's author is not an owner, member or collaborator"
              elif [ "$COMMENT_HAS_PHRASE" != "true" ]; then
                why="the comment does not contain the trigger phrase"
              else
                act=true
              fi
              ;;
            issues/opened)
              if ! trusted "$ISSUE_ASSOCIATION"; then
                why="the issue's author is not an owner, member or collaborator"
              elif [ "$ISSUE_HAS_PHRASE" != "true" ]; then
                why="the issue does not contain the trigger phrase"
              else
                act=true
              fi
              ;;
            issues/labeled)
              if [ "$IS_PULL_REQUEST" = "true" ]; then
                why="the label trigger works on issues only"
              elif [ "$LABEL_MATCHES" != "true" ]; then
                why="the label added is not the trigger label"
              else
                act=true
              fi
              ;;
          esac

          if [ "$act" = "true" ] && { [ -z "$LETTA_API_KEY" ] || [ -z "$AGENT_ID" ]; }; then
            act=false
            why="LETTA_API_KEY or agent-id is missing"
          fi

          if [ "$act" = "true" ]; then
            echo "Calling the agent."
          else
            echo "Not calling the agent: $why. Reporting the check only."
          fi
          echo "act=$act" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.act.outputs.act == 'true' }}

      - uses: letta-ai/letta-code-action@b50e45b91c77d5a7b8a64f4088bedcd8c442bd13 # v0.0.6
        if: ${{ steps.act.outputs.act == 'true' }}
        with:
          letta_api_key: ${{ secrets.LETTA_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          agent_id: ${{ inputs.agent-id }}
          trigger_phrase: ${{ inputs.trigger-phrase }}
          label_trigger: ${{ inputs.label-trigger }}
